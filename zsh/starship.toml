# Starship prompt configuration
# https://starship.rs/config/
#
# Symlink to ~/.config/starship.toml

# Prompt format - similar to previous Spaceship setup
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$ruby\
$python\
$cmd_duration\
$line_break\
$battery\
$character"""

# Directory
[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

# Git branch
[git_branch]
symbol = " "
style = "bold purple"

# Git status
[git_status]
style = "bold red"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
staged = "+${count}"
modified = "!${count}"
untracked = "?${count}"

# Command duration - only show if > 2 seconds
[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "yellow"

# Battery - show when below 30%
[battery]
full_symbol = "🔋"
charging_symbol = "⚡"
discharging_symbol = "💀"

[[battery.display]]
threshold = 30
style = "bold red"

# Prompt character
[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"

# Node.js - managed by Volta
[nodejs]
symbol = " "
style = "bold green"

# Ruby - managed by mise
[ruby]
symbol = " "
style = "bold red"

# Python - managed by mise
[python]
symbol = " "
style = "bold yellow"

# Username - only show in SSH sessions
[username]
show_always = false
style_user = "bold blue"

# Hostname - only show in SSH sessions
[hostname]
ssh_only = true
style = "bold green"
